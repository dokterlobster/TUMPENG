function foodCost(p){return p.kind==='catering'?cateringTotals[p.name]:p.recipes.reduce((s,r)=>s+r.cost,0)} function allIn(p){return p.kind==='catering'?foodCost(p):foodCost(p)+p.tampah+p.pax*2100}
function rowForIng(x){const u=U[x.key]; if(!u||x.qty===0)return `<tr><td data-label="Bahan">${x.label}</td><td class="num" data-label="Takaran">${x.qty===0?'secukupnya':fmtQty(x.qty,'')}</td><td class="num" data-label="Harga satuan">—</td><td class="num" data-label="Biaya">—</td></tr>`;return `<tr><td data-label="Bahan">${x.label}</td><td class="num" data-label="Takaran">${fmtQty(x.qty,u[1])}</td><td class="num" data-label="Harga satuan">${R(u[0])}/${u[1]}</td><td class="num" data-label="Biaya">${R(u[0]*x.qty)}</td></tr>`}
function componentTable(p){return p.recipes.map(r=>`<tr><td>${r.name}</td><td>${r.output}</td><td class="num">${R(r.cost)}</td></tr>`).join('')}
function packageMarkup(p){const food=foodCost(p),all=allIn(p),pct=all/p.price*100,kind=p.type==='Tumpeng Kuning'?'pkg-kind-kuning':'pkg-kind-liwet';return `<section class="package" data-detail-view="${activeView}"><div class="package-title"><div><div class="eyebrow ${kind}">${p.type}</div><h2>${p.type} ${p.pax} Pax</h2></div><div class="right"><b>${R(p.price)}</b><span>harga jual · tampah ${p.cm} cm</span></div></div><div class="band"><span>Target HPP: <strong>${R(p.price*.30)}–${R(p.price*.35)}</strong></span><span>Total HPP: <strong>${R(all)} (${pct.toFixed(1).replace('.',',')}%)</strong></span></div><section class="detail-summary"><h3>Komponen paket</h3><table class="summary-table"><thead><tr><th>Komponen paket</th><th>Takaran</th><th class="num">HPP</th></tr></thead><tbody>${componentTable(p)}<tr class="total"><td colspan="2">Subtotal makanan + garnish</td><td class="num">${R(food)}</td></tr><tr><td colspan="2">Tampah ${p.cm} cm</td><td class="num">${R(p.tampah)}</td></tr><tr><td colspan="2">Overhead + packing (${p.pax} × Rp2.100)</td><td class="num">${R(p.pax*2100)}</td></tr><tr class="allin"><td colspan="2">TOTAL HPP</td><td class="num">${R(all)} · ${pct.toFixed(1).replace('.',',')}%</td></tr></tbody></table></section><section class="detail-recipes"><h3>Rincian bahan &amp; biaya</h3>${p.recipes.map(r=>`<details><summary><span>${r.name}</span><span style="margin-left:auto">${r.output} · ${R(r.cost)}</span></summary><div class="recipe-body"><div class="recipe-meta"><span>Hasil: <b>${r.output}</b></span><span>Total: <b>${R(r.cost)}</b></span></div><table><thead><tr><th>Bahan</th><th class="num">Takaran</th><th class="num">Harga satuan</th><th class="num">Biaya</th></tr></thead><tbody>${r.items.map(rowForIng).join('')}<tr class="total"><td colspan="3" data-label=""> <b>Total HPP ${r.name}</b></td><td class="num" data-label="Total"><b>${R(r.cost)}</b></td></tr></tbody></table></div></details>`).join('')}</section></section>`}
let activeType='Tumpeng Kuning',activePax=20,activeView='summary';
function activePack(){return packs.find(p=>p.type===activeType&&p.pax===activePax)}
function pickerMarkup(){return `<div class="picker"><div class="selection-controls"><span class="picker-label">Porsi</span><div class="segmented" role="tablist" aria-label="Jumlah porsi">${[20,30,40].map(pax=>`<button type="button" role="tab" data-pax="${pax}" aria-selected="${activePax===pax}">${pax} pax</button>`).join('')}</div></div></div>`}
function detailTabsMarkup(){return `<button type="button" data-view="summary" aria-selected="${activeView==='summary'}">Ringkasan</button><button type="button" data-view="recipes" aria-selected="${activeView==='recipes'}">Resep</button>`}
function activeSummary(p){const all=allIn(p),pct=all/p.price*100,ok=pct<=35;return `<div class="active-summary"><div class="active-intro"><div class="eyebrow ${p.type==='Tumpeng Kuning'?'pkg-kind-kuning':'pkg-kind-liwet'}">${p.type}</div><h3>${p.pax} pax</h3><p>Tampah ${p.cm} cm · overhead sudah termasuk</p></div><div class="metric"><span>Harga jual</span><b>${R(p.price)}</b></div><div class="metric hpp"><span>Total HPP</span><b>${R(all)}</b></div><div class="metric hpp"><span>HPP all-in</span><b>${pct.toFixed(1).replace('.',',')}%</b><em class="status ${ok?'good':'warn'}">${ok?'Dalam target':'Di atas target'}</em></div></div>`}
function packageVisual(p){const src=packageImages[p.type][p.pax];return `<img src="${src}" alt="Foto referensi tumpeng di atas tampah bambu" width="1536" height="1024" decoding="async">`}
function renderActivePackage(){const p=activePack();document.querySelector('#produk-aktif').textContent=p.type;document.querySelector('#picker').innerHTML=pickerMarkup();document.querySelector('#package-image').innerHTML=packageVisual(p);document.querySelector('#active-summary').innerHTML=activeSummary(p);document.querySelector('#detail-tabs').innerHTML=detailTabsMarkup();document.querySelector('#packages').innerHTML=packageMarkup(p);document.querySelector('#catalog-select').value=activeType;document.querySelectorAll('[data-type]').forEach(button=>{button.classList.toggle('is-active',button.dataset.type===activeType);button.setAttribute('aria-current',button.dataset.type===activeType?'page':'false');button.addEventListener('click',()=>{activeType=button.dataset.type;activeView='summary';renderActivePackage()})});document.querySelectorAll('[data-pax]').forEach(button=>button.addEventListener('click',()=>{activePax=Number(button.dataset.pax);renderActivePackage()}));document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{activeView=button.dataset.view;renderActivePackage()}));document.querySelector('#catalog-select').addEventListener('change',event=>{activeType=event.target.value;activeView='summary';renderActivePackage()})}

pickerMarkup=()=>{if(activeType.startsWith('Catering')){const menus=cateringPacks.filter(p=>p.type===activeType);return '<div class="picker"><div class="selection-controls"><span class="picker-label">Menu</span><div class="menu-toggle-grid" role="group" aria-label="Pilih menu">'+menus.map(p=>'<button type="button" class="menu-toggle" data-menu="'+p.name+'" aria-pressed="'+(activeMenu[activeType]===p.name)+'">'+p.name+'</button>').join('')+'</div></div></div>'}return '<div class="picker"><div class="selection-controls"><span class="picker-label">Porsi</span><div class="segmented" role="tablist" aria-label="Jumlah porsi">'+[20,30,40].map(pax=>'<button type="button" role="tab" data-pax="'+pax+'" aria-selected="'+(activePax===pax)+'">'+pax+' pax</button>').join('')+'</div></div></div>'};
detailTabsMarkup=()=>'<button type="button" data-view="summary" aria-selected="'+(activeView==='summary')+'">Ringkasan</button><button type="button" data-view="recipes" aria-selected="'+(activeView==='recipes')+'">'+(activeType.startsWith('Catering')?'Komponen':'Resep')+'</button>';
activeSummary=p=>{const all=allIn(p),pct=all/p.price*100;if(p.kind==='catering')return '<div class="active-summary catering-summary"><div class="active-intro"><div class="eyebrow">Catering · '+p.type.replace('Catering ','')+'</div><h3>'+p.name+'</h3><p>1 porsi · harga dan HPP mengikuti COGS</p></div><div class="metric"><span>Harga jual</span><b>'+R(p.price)+'</b></div><div class="metric hpp"><span>Total HPP</span><b>'+R(all)+'</b></div><div class="metric hpp"><span>HPP aktual</span><b>'+pct.toFixed(1).replace('.',',')+'%</b></div></div>';const ok=pct<=35;return '<div class="active-summary"><div class="active-intro"><div class="eyebrow '+(p.type==='Tumpeng Kuning'?'pkg-kind-kuning':'pkg-kind-liwet')+'">'+p.type+'</div><h3>'+p.pax+' pax</h3><p>Tampah '+p.cm+' cm · overhead sudah termasuk</p></div><div class="metric"><span>Harga jual</span><b>'+R(p.price)+'</b></div><div class="metric hpp"><span>Total HPP</span><b>'+R(all)+'</b></div><div class="metric hpp"><span>HPP all-in</span><b>'+pct.toFixed(1).replace('.',',')+'%</b><em class="status '+(ok?'good':'warn')+'">'+(ok?'Dalam target':'Di atas target')+'</em></div></div>'};
const cateringComponentMarkup=(p,x)=>{const recipe=(p.type==='Catering Premium'||(p.type==='Catering Kids'&&x[0]==='Capcay'))?cateringSubrecipes[x[0]]:null,base='<span>'+x[0]+'</span><span style="margin-left:auto">'+x[1]+' · '+(x[2]==='-'?'—':R(x[2]))+'</span>';if(!recipe)return '<div class="catering-component">'+base+'</div>';const rows=recipe.items.map(i=>'<tr><td>'+i[0]+'</td><td>'+i[1]+'</td><td class="num">'+R(i[2])+'</td></tr>').join('');return '<details class="catering-subrecipe"><summary>'+base+'</summary><div class="recipe-body"><div class="recipe-meta"><span>'+recipe.batch+'</span><span>Total batch: <b>'+R(recipe.total)+'</b></span></div><table><thead><tr><th>Bahan mentah</th><th>Takaran × harga</th><th class="num">Biaya</th></tr></thead><tbody>'+rows+'<tr class="total"><td colspan="2"><b>Total batch</b></td><td class="num"><b>'+R(recipe.total)+'</b></td></tr></tbody></table></div></details>'};
cateringMarkup=p=>{const total=foodCost(p),pct=total/p.price*100,details=p.components.map(x=>cateringComponentMarkup(p,x)).join('');return '<section class="package catering-package" data-detail-view="'+activeView+'"><section class="detail-summary"><h3>Isi menu</h3><p class="catering-menu-note">'+p.components.slice(0,-2).map(x=>x[0]).join(' · ')+'</p><table class="summary-table"><thead><tr><th>Ringkasan</th><th class="num">Nilai</th></tr></thead><tbody><tr><td>Harga jual</td><td class="num">'+R(p.price)+'</td></tr><tr><td>Total HPP</td><td class="num">'+R(total)+'</td></tr><tr class="allin"><td>HPP aktual</td><td class="num">'+pct.toFixed(1).replace('.',',')+'%</td></tr></tbody></table></section><section class="detail-recipes"><h3>Rincian komponen</h3><div class="catering-components">'+details+'</div><table class="summary-table catering-breakdown"><tbody><tr class="total"><td>TOTAL HPP</td><td class="num">'+R(total)+' · '+pct.toFixed(1).replace('.',',')+'%</td></tr></tbody></table></section></section>'};
const emptyStateMarkup=()=>'<section class="empty-state"><div class="eyebrow">Catering · Kids</div><h3>Menu belum ditambahkan</h3><p>Tambahkan file atau daftar menu Kids, nanti akan masuk ke katalog ini dengan harga dan HPP-nya.</p></section>';
renderActivePackage=()=>{const p=activePack(),isCatering=activeType.startsWith('Catering');document.querySelector('#produk-aktif').textContent=isCatering?'Catering · '+activeType.replace('Catering ',''):p.type;document.querySelector('#picker').innerHTML=pickerMarkup();document.querySelector('#package-image').hidden=isCatering;document.querySelector('#package-image').innerHTML=isCatering?'':packageVisual(p);document.querySelector('#active-summary').innerHTML=activeSummary(p);document.querySelector('#detail-tabs').innerHTML=detailTabsMarkup();document.querySelector('#packages').innerHTML=p.kind==='catering'?cateringMarkup(p):packageMarkup(p);document.querySelector('#catalog-select').value=activeType;document.querySelectorAll('[data-type]').forEach(button=>{button.classList.toggle('is-active',button.dataset.type===activeType);button.setAttribute('aria-current',button.dataset.type===activeType?'page':'false');button.addEventListener('click',()=>{activeType=button.dataset.type;activeView='summary';renderActivePackage()})});document.querySelectorAll('[data-pax]').forEach(button=>button.addEventListener('click',()=>{activePax=Number(button.dataset.pax);renderActivePackage()}));document.querySelectorAll('[data-menu]').forEach(button=>button.addEventListener('click',()=>{activeMenu[activeType]=button.dataset.menu;renderActivePackage()}));document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{activeView=button.dataset.view;renderActivePackage()}));document.querySelector('#catalog-select').addEventListener('change',event=>{activeType=event.target.value;activeView='summary';renderActivePackage()})};
renderActivePackage();
</script></body></html>
